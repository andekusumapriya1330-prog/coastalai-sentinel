version: "3.8"
services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_SECRET=change-this-in-production
      - CORS_ORIGIN=http://localhost:5173
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
